name: deploy-s3-bucket
description: Plan/apply gh-platform-modules s3-bucket example by delegating to Commons.
author: gh-platform

inputs:
  modules_repository:
    description: OWNER/gh-platform-modules
    required: true
  modules_ref:
    description: Immutable modules tag or SHA
    required: true
  command:
    description: plan | apply | destroy
    required: false
    default: plan
  confirm_apply:
    description: Must be APPLY for apply/destroy
    required: false
    default: ""
  aws_region:
    required: false
    default: us-east-1
  tfvars_file:
    description: Optional tfvars relative to examples/s3-bucket
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Requires this repository checked out so ./actions/iac/commons resolves
    # (control plane checks out gh-platform-actions to .gh-platform-actions and
    # should prefer calling Commons directly; this wrapper is for same-repo CI).
    - name: Run Commons
      uses: ./actions/iac/commons
      with:
        modules_repository: ${{ inputs.modules_repository }}
        modules_ref: ${{ inputs.modules_ref }}
        module_path: examples/s3-bucket
        command: ${{ inputs.command }}
        confirm_apply: ${{ inputs.confirm_apply }}
        aws_region: ${{ inputs.aws_region }}
        tfvars_file: ${{ inputs.tfvars_file }}
