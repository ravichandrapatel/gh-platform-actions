name: tofu-plan-apply

on:
  workflow_call:
    inputs:
      modules_repository:
        type: string
        required: true
      modules_ref:
        type: string
        required: true
      module_path:
        type: string
        required: true
      command:
        type: string
        required: false
        default: plan
      confirm_apply:
        type: string
        required: false
        default: ""
      aws_region:
        type: string
        required: false
        default: us-east-1
      environment:
        type: string
        required: true
      aws_role_arn:
        type: string
        required: true
    secrets:
      # none — OIDC only
      placeholder:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  tofu:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout actions repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Run Commons
        uses: ./actions/iac/commons
        with:
          modules_repository: ${{ inputs.modules_repository }}
          modules_ref: ${{ inputs.modules_ref }}
          module_path: ${{ inputs.module_path }}
          command: ${{ inputs.command }}
          confirm_apply: ${{ inputs.confirm_apply }}
          aws_region: ${{ inputs.aws_region }}
