name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify action manifests exist
        run: |
          set -euo pipefail
          test -f actions/iac/commons/action.yml
          test -f actions/deploy/s3-bucket/action.yml
          test -f actions/release/module-semver/action.yml
          test -f actions/iac/commons/readme.md
          test -f actions/deploy/s3-bucket/readme.md
          test -f actions/release/module-semver/readme.md
          test -f .github/workflows/module-release.yml
          test -f docs/workflows/module-release.md
