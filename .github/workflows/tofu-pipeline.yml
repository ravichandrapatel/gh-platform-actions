# FILE_NAME: tofu-pipeline.yml
# DESCRIPTION: Multi-stage reusable OpenTofu pipeline — validate → plan+OPA+cost → gated apply.
# VERSION: 0.4.0
# AUTHORS: gh-platform

name: tofu-pipeline

on:
  workflow_call:
    inputs:
      working_directory:
        description: Path in the caller repo that contains the OpenTofu root module.
        required: false
        type: string
        default: "."
      command:
        description: plan (default) or apply. apply requires confirm_apply=APPLY.
        required: false
        type: string
        default: plan
      confirm_apply:
        description: Must be the literal string APPLY to run apply or destroy.
        required: false
        type: string
        default: ""
      environment:
        description: GitHub Environment for the apply stage only (reviewers / protection).
        required: true
        type: string
      aws_role_arn:
        description: IAM role ARN for OIDC assume-role.
        required: true
        type: string
      aws_region:
        description: AWS region.
        required: false
        type: string
        default: us-east-1
      tofu_version:
        description: OpenTofu version.
        required: false
        type: string
        default: "1.10.10"
      tfvars_file:
        description: Optional tfvars path relative to working_directory.
        required: false
        type: string
        default: ""
      checkov_soft_fail:
        description: If true, Checkov findings do not fail the job.
        required: false
        type: boolean
        default: false
      tfsec_soft_fail:
        description: If true, tfsec findings do not fail the job.
        required: false
        type: boolean
        default: false
      c3x_soft_fail:
        description: If true, C3X cost estimation failures do not fail the plan job.
        required: false
        type: boolean
        default: true
      conftest_version:
        description: Conftest release version (without leading v).
        required: false
        type: string
        default: "0.68.2"
      policy_path:
        description: Policy directory inside this actions repo.
        required: false
        type: string
        default: policies/conftest/terraform
      control_app_client_id:
        description: >-
          GitHub App Client ID used with control_app_private_key to mint a short-lived
          token scoped to modules_git_repository for private module download.
        required: false
        type: string
        default: ""
      modules_git_repository:
        description: >-
          owner/name of the private modules repo (e.g. org/gh-platform-modules).
          Required when using control_app_client_id mint.
        required: false
        type: string
        default: ""
    secrets:
      control_app_private_key:
        description: >-
          GitHub App private key (PEM). Used with control_app_client_id to mint a
          short-lived installation token for modules_git_repository.
        required: false
      modules_git_token:
        description: >-
          Optional PAT fallback with contents:read on private module repos.
          Prefer control_app_* + modules_git_repository (GitHub App mint).
        required: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — validate: fmt, init, validate, Checkov, tfsec
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve policy / actions pack repository
        id: policy_repo
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REF%%/.github/*}"
          if [[ -z "${repo}" || "${repo}" == "${WORKFLOW_REF}" ]]; then
            echo "::error::unable to parse actions repository from github.workflow_ref=${WORKFLOW_REF}"
            exit 1
          fi
          echo "repository=${repo}" >> "${GITHUB_OUTPUT}"

      - name: Checkout policy pack + composites (this actions repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.policy_repo.outputs.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-platform-actions
          sparse-checkout: |
            policies
            actions

      - name: Resolve modules repo scope
        id: modules-scope
        if: ${{ inputs.control_app_client_id != '' && inputs.modules_git_repository != '' }}
        env:
          MODULES_GIT_REPOSITORY: ${{ inputs.modules_git_repository }}
        run: |
          set -euo pipefail
          echo "owner=${MODULES_GIT_REPOSITORY%%/*}" >> "${GITHUB_OUTPUT}"
          echo "repo=${MODULES_GIT_REPOSITORY##*/}" >> "${GITHUB_OUTPUT}"

      - name: Mint GitHub App token for modules
        id: modules-app
        if: ${{ inputs.control_app_client_id != '' && inputs.modules_git_repository != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.control_app_client_id }}
          private-key: ${{ secrets.control_app_private_key }}
          owner: ${{ steps.modules-scope.outputs.owner }}
          repositories: ${{ steps.modules-scope.outputs.repo }}

      - name: Configure git auth for module download
        env:
          MODULES_GIT_TOKEN: ${{ steps.modules-app.outputs.token || secrets.modules_git_token }}
        run: |
          set -euo pipefail
          token="${MODULES_GIT_TOKEN:-}"
          if [[ -z "${token}" ]]; then
            echo "WARN: no modules token (App mint or modules_git_token) — private git modules will fail to download"
            exit 0
          fi
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "git@github.com:"
          echo "Configured git HTTPS rewrite for module download"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu_version }}

      - name: OpenTofu fmt -check
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          tofu fmt -check -recursive -diff

      - name: OpenTofu init (modules/providers, no backend)
        working-directory: ${{ inputs.working_directory }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          # -backend=false: download modules + providers without AWS state access
          tofu init -input=false -backend=false

      - name: OpenTofu validate
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          tofu validate

      - name: Checkov (Terraform/OpenTofu)
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          directory: ${{ inputs.working_directory }}
          framework: terraform
          soft_fail: ${{ inputs.checkov_soft_fail }}
          config_file: .gh-platform-actions/policies/checkov/.checkov.yml
          output_format: cli

      - name: tfsec (Terraform/OpenTofu)
        uses: ./.gh-platform-actions/actions/security/tfsec
        with:
          directory: ${{ inputs.working_directory }}
          soft_fail: ${{ inputs.tfsec_soft_fail }}

  # ---------------------------------------------------------------------------
  # Stage 2 — plan: full init, plan, Conftest/OPA, C3X cost summary
  # ---------------------------------------------------------------------------
  plan:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve modules repo scope
        id: modules-scope
        if: ${{ inputs.control_app_client_id != '' && inputs.modules_git_repository != '' }}
        env:
          MODULES_GIT_REPOSITORY: ${{ inputs.modules_git_repository }}
        run: |
          set -euo pipefail
          echo "owner=${MODULES_GIT_REPOSITORY%%/*}" >> "${GITHUB_OUTPUT}"
          echo "repo=${MODULES_GIT_REPOSITORY##*/}" >> "${GITHUB_OUTPUT}"

      - name: Mint GitHub App token for modules
        id: modules-app
        if: ${{ inputs.control_app_client_id != '' && inputs.modules_git_repository != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.control_app_client_id }}
          private-key: ${{ secrets.control_app_private_key }}
          owner: ${{ steps.modules-scope.outputs.owner }}
          repositories: ${{ steps.modules-scope.outputs.repo }}

      - name: Configure git auth for module download
        env:
          MODULES_GIT_TOKEN: ${{ steps.modules-app.outputs.token || secrets.modules_git_token }}
        run: |
          set -euo pipefail
          token="${MODULES_GIT_TOKEN:-}"
          if [[ -z "${token}" ]]; then
            echo "WARN: no modules token (App mint or modules_git_token) — private git modules will fail to download"
            exit 0
          fi
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "git@github.com:"
          echo "Configured git HTTPS rewrite for module download"

      - name: Resolve policy pack repository
        id: policy_repo
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REF%%/.github/*}"
          if [[ -z "${repo}" || "${repo}" == "${WORKFLOW_REF}" ]]; then
            echo "::error::unable to parse actions repository from github.workflow_ref=${WORKFLOW_REF}"
            exit 1
          fi
          echo "repository=${repo}" >> "${GITHUB_OUTPUT}"

      - name: Checkout policy pack + composites (this actions repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.policy_repo.outputs.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-platform-actions
          sparse-checkout: |
            policies
            actions

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu_version }}

      - name: Install Conftest (checksum-verified)
        env:
          CONFTEST_VERSION: ${{ inputs.conftest_version }}
          CONFTEST_SHA256: e8144c6d6d2ae0260b869caa60c7c262a1f95ac63ec1e5d2fb19be452d606347
        run: |
          set -euo pipefail
          if [[ "${CONFTEST_VERSION}" != "0.68.2" ]]; then
            echo "::error::pin mismatch: update CONFTEST_SHA256 when changing conftest_version (got ${CONFTEST_VERSION})"
            exit 1
          fi
          asset="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          url="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${asset}"
          curl -fsSL --retry 3 -o "/tmp/${asset}" "${url}"
          echo "${CONFTEST_SHA256}  /tmp/${asset}" | sha256sum -c -
          tar -xzf "/tmp/${asset}" -C /tmp conftest
          sudo install -m 0755 /tmp/conftest /usr/local/bin/conftest
          conftest --version

      - name: Artifact name
        id: art
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          name="$(printf '%s' "${WD}" | tr '/.' '-' | sed 's/^-*//;s/-*$//')"
          if [[ -z "${name}" || "${name}" == "." ]]; then
            name="root"
          fi
          echo "name=tfplan-${name}" >> "${GITHUB_OUTPUT}"

      - name: OpenTofu init
        working-directory: ${{ inputs.working_directory }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          tofu init -input=false

      - name: OpenTofu plan
        working-directory: ${{ inputs.working_directory }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
          TFVARS_FILE: ${{ inputs.tfvars_file }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${TFVARS_FILE}" ]]; then
            args+=(-var-file="${TFVARS_FILE}")
          fi
          tofu plan -input=false -out=tfplan "${args[@]}"
          tofu show -json tfplan > tfplan.json

      - name: Conftest / OPA (policies on plan JSON)
        working-directory: ${{ inputs.working_directory }}
        env:
          POLICY_PATH: ${{ inputs.policy_path }}
        run: |
          set -euo pipefail
          policy_dir="${GITHUB_WORKSPACE}/.gh-platform-actions/${POLICY_PATH}"
          if [[ ! -d "${policy_dir}" ]]; then
            echo "::error::policy directory not found: ${policy_dir}"
            exit 1
          fi
          conftest test tfplan.json -p "${policy_dir}" --all-namespaces

      - name: C3X cost summary (job summary)
        uses: ./.gh-platform-actions/actions/cost/c3x-summary
        with:
          plan_path: ${{ inputs.working_directory }}/tfplan.json
          region: ${{ inputs.aws_region }}
          soft_fail: ${{ inputs.c3x_soft_fail }}

      - name: Upload plan artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/tfplan.json
          if-no-files-found: error
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Stage 3 — apply: Environment-gated; uses plan artifact from stage 2
  # ---------------------------------------------------------------------------
  apply:
    needs: [validate, plan]
    if: inputs.command == 'apply' && inputs.confirm_apply == 'APPLY'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve modules repo scope
        id: modules-scope
        if: ${{ inputs.control_app_client_id != '' && inputs.modules_git_repository != '' }}
        env:
          MODULES_GIT_REPOSITORY: ${{ inputs.modules_git_repository }}
        run: |
          set -euo pipefail
          echo "owner=${MODULES_GIT_REPOSITORY%%/*}" >> "${GITHUB_OUTPUT}"
          echo "repo=${MODULES_GIT_REPOSITORY##*/}" >> "${GITHUB_OUTPUT}"

      - name: Mint GitHub App token for modules
        id: modules-app
        if: ${{ inputs.control_app_client_id != '' && inputs.modules_git_repository != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.control_app_client_id }}
          private-key: ${{ secrets.control_app_private_key }}
          owner: ${{ steps.modules-scope.outputs.owner }}
          repositories: ${{ steps.modules-scope.outputs.repo }}

      - name: Configure git auth for module download
        env:
          MODULES_GIT_TOKEN: ${{ steps.modules-app.outputs.token || secrets.modules_git_token }}
        run: |
          set -euo pipefail
          token="${MODULES_GIT_TOKEN:-}"
          if [[ -z "${token}" ]]; then
            echo "WARN: no modules token (App mint or modules_git_token) — private git modules will fail to download"
            exit 0
          fi
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "git@github.com:"
          echo "Configured git HTTPS rewrite for module download"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu_version }}

      - name: Artifact name
        id: art
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          name="$(printf '%s' "${WD}" | tr '/.' '-' | sed 's/^-*//;s/-*$//')"
          if [[ -z "${name}" || "${name}" == "." ]]; then
            name="root"
          fi
          echo "name=tfplan-${name}" >> "${GITHUB_OUTPUT}"

      - name: Download plan artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.art.outputs.name }}
          path: ${{ inputs.working_directory }}

      - name: OpenTofu init
        working-directory: ${{ inputs.working_directory }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          tofu init -input=false

      - name: OpenTofu apply
        working-directory: ${{ inputs.working_directory }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          tofu apply -input=false -auto-approve tfplan

  destroy:
    needs: validate
    if: inputs.command == 'destroy' && inputs.confirm_apply == 'APPLY'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve modules repo scope
        id: modules-scope
        if: ${{ inputs.control_app_client_id != '' && inputs.modules_git_repository != '' }}
        env:
          MODULES_GIT_REPOSITORY: ${{ inputs.modules_git_repository }}
        run: |
          set -euo pipefail
          echo "owner=${MODULES_GIT_REPOSITORY%%/*}" >> "${GITHUB_OUTPUT}"
          echo "repo=${MODULES_GIT_REPOSITORY##*/}" >> "${GITHUB_OUTPUT}"

      - name: Mint GitHub App token for modules
        id: modules-app
        if: ${{ inputs.control_app_client_id != '' && inputs.modules_git_repository != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.control_app_client_id }}
          private-key: ${{ secrets.control_app_private_key }}
          owner: ${{ steps.modules-scope.outputs.owner }}
          repositories: ${{ steps.modules-scope.outputs.repo }}

      - name: Configure git auth for module download
        env:
          MODULES_GIT_TOKEN: ${{ steps.modules-app.outputs.token || secrets.modules_git_token }}
        run: |
          set -euo pipefail
          token="${MODULES_GIT_TOKEN:-}"
          if [[ -z "${token}" ]]; then
            echo "WARN: no modules token (App mint or modules_git_token) — private git modules will fail to download"
            exit 0
          fi
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "git@github.com:"
          echo "Configured git HTTPS rewrite for module download"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu_version }}

      - name: OpenTofu init
        working-directory: ${{ inputs.working_directory }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          tofu init -input=false

      - name: OpenTofu destroy
        working-directory: ${{ inputs.working_directory }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
          TFVARS_FILE: ${{ inputs.tfvars_file }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${TFVARS_FILE}" ]]; then
            args+=(-var-file="${TFVARS_FILE}")
          fi
          tofu destroy -input=false -auto-approve "${args[@]}"
